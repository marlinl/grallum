<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Grallum Registry</title>
    <link rel="stylesheet" th:href="@{/assets/style.css}">
  </head>
  <body>
    <header>
      <a href="/">Grallum Registry</a>
      <nav>
        <a href="/repositories">仓库</a>
        <a href="/users">用户</a>
      </nav>
    </header>
    <main>
      <h1>Docker 仓库</h1>
      <table>
        <thead>
          <tr>
            <th>镜像前缀</th>
            <th>模式</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="repository : ${repositories.items}">
            <td>
              <a th:href="@{/repositories/{id}(id=${repository.id})}" th:text="${repository.imagePrefix}">
              </a>
            </td>
            <td th:text="${repository.mode}">
            </td>
            <td>
              <a th:href="@{/repositories/{id}/tags(id=${repository.id})}">标签</a>
            </td>
          </tr>
        </tbody>
      </table>
      <p th:if="${repositoriesEmpty}">没有可见仓库。</p>
      <a th:if="${nextCursor != null}" th:href="@{/repositories(last=${nextCursor})}">下一页</a>
      <section th:if="${user.administrator}">
        <h2>注册仓库</h2>
        <form th:action="@{/repositories}" method="post">
          <label>Registry 别名<input name="registry" required placeholder="private">
          </label>
          <label>仓库名称<input name="name" required placeholder="team/app">
          </label>
          <button>注册</button>
        </form>
      </section>
    </main>
    <footer>
      <form th:action="@{/auth/refresh}" method="post">
        <button>续期登录</button>
      </form>
      <form th:action="@{/auth/logout}" method="post">
        <button>退出登录</button>
      </form>
    </footer>
  </body>
</html>
