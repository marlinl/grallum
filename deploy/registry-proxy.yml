version: 0.1
log:
  level: info
storage:
  filesystem:
    rootdirectory: /var/lib/registry
  delete:
    enabled: true
  redirect:
    disable: true
http:
  addr: :5000
  relativeurls: true
proxy:
  remoteurl: https://registry-1.docker.io
  # Expiration is managed per repository by the application via proxy-admin.
  ttl: 0s
